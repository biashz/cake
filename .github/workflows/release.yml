name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  binaries:
    name: binaries (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # ESM single-file builds (Node SEA, mainFormat: module) need >= 26.9.
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi
      - name: Build CLI single-file binary (Node SEA)
        run: pnpm cli:binary
      - name: Build desktop installer (NSIS + portable)
        run: pnpm desktop:dist
      - name: Write checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe > SHA256SUMS.txt
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: cake-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release/*.exe release/*.blockmap release/SHA256SUMS.txt)
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --draft --generate-notes --title "Cake $TAG"
          gh release upload "$TAG" "${assets[@]}" --clobber
